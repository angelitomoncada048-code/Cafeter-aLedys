<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafetería Ledy’s · Olanchito, Yoro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fffdfa;--ink:#3a2314;--mut:#8f7360;--or:#ee6c1d;--line:#f6dcc6;--wash:#fff6ec;--t:1.2s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130c;--card:#2a1b11;--ink:#fff4ea;--mut:#d9b99d;--line:#4a3120;--wash:#2a1b11}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;transition:opacity var(--t) ease,transform var(--t) ease}
.top::-webkit-scrollbar{display:none}
.top.off{opacity:0;transform:translateY(-100%);pointer-events:none}
.top button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .85rem Nunito,sans-serif;padding:6px 14px;border-radius:99px;cursor:pointer;transition:all .6s}
.top button.on{background:var(--or);border-color:var(--or);color:#fff}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.page{position:fixed;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity var(--t) ease,transform var(--t) ease,visibility 0s var(--t)}
.page.on{opacity:1;visibility:visible;transform:none;transition:opacity var(--t) ease .35s,transform var(--t) ease .35s,visibility 0s}
.wrap{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 18px calc(env(safe-area-inset-bottom,0px) + 100px)}
#p0{display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 38%,var(--wash),var(--bg) 70%)}
#p0 .in{padding:30px 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
#p0 h1{font:600 clamp(1.5rem,5vw,2.2rem) Fraunces,Georgia,serif;margin:0 0 22px;color:var(--mut)}
.logo{width:min(70vw,320px);aspect-ratio:1;object-fit:cover;border-radius:50%;display:block;margin:0 auto;filter:drop-shadow(0 18px 28px rgba(120,60,20,.2))}
#p0 .logo{animation:in 2.4s ease both .3s}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#p0 p{margin:22px 0 4px;font-weight:600}
.sub{color:var(--mut);font-size:.92rem;margin:0}
.go{margin-top:26px;border:0;background:var(--or);color:#fff;font:700 1rem Nunito,sans-serif;padding:13px 34px;border-radius:99px;cursor:pointer}
h2{font:800 clamp(2rem,7vw,2.8rem) Fraunces,Georgia,serif;margin:0;line-height:1.1}
.bar{width:54px;height:3px;background:var(--or);border-radius:3px;margin:12px 0}
.note{color:var(--mut);margin:0 0 20px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tag{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:14px;padding:14px 16px}
.tag b{font-weight:700;line-height:1.3}
.tag small{display:block;color:var(--mut);font-size:.82rem;margin-top:4px;line-height:1.35}
.tag{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.wa{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;margin-top:auto;text-decoration:none;font:700 .82rem Nunito,sans-serif;color:#128c4a;background:#effaf3;border:1px solid #b9ebcd;padding:7px 13px;border-radius:99px;transition:background .6s}
.wa:hover{background:#dff5e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{color:#6ee7a3;background:transparent;border-color:#2f6b4a}}
.wa:focus-visible{outline:3px solid #25d366;outline-offset:2px}
.price{font:800 1.1rem Fraunces,Georgia,serif;color:var(--or);white-space:nowrap}
.price.t{font-size:.85rem;color:var(--mut);text-align:right;white-space:normal}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);border-top:1px solid var(--line);transition:opacity var(--t) ease,transform var(--t) ease}
.nav.off{opacity:0;transform:translateY(100%);pointer-events:none}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 .88rem Nunito,sans-serif;padding:10px 16px;border-radius:99px;cursor:pointer;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav span{font-size:.8rem;color:var(--mut)}
.foot{margin-top:34px;text-align:center;color:var(--mut);font-size:1rem;line-height:1.6}.foot strong{color:var(--ink);font-weight:700}.lps{font-size:.82rem}
.foot a{color:var(--or);font-weight:700}
@media (prefers-reduced-motion:reduce){:root{--t:.01s}#p0 .logo{animation:none}}
</style>
</head>
